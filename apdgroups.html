<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>APD Groups</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: white;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(to right, #6B46C1, #553C9A);
            color: white;
            padding: 1rem 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header p {
            color: #e9d5ff;
            font-size: 1.125rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .volunteer-form {
            background-color: #faf5ff;
            border: 2px solid #e9d5ff;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .volunteer-form h2 {
            color: #6d28d9;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .form-row input,
        .form-row select {
            flex: 1;
            min-width: 200px;
            padding: 0.75rem 1rem;
            border: 2px solid #d8b4fe;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: 'Times New Roman', Times, serif;
        }

        .form-row input:focus,
        .form-row select:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .btn-volunteer {
            padding: 0.75rem 1.5rem;
            background-color: #7c3aed;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: 'Times New Roman', Times, serif;
        }

        .btn-volunteer:hover {
            background-color: #6d28d9;
        }

        .btn-volunteer:disabled {
            background-color: #d8b4fe;
            cursor: not-allowed;
        }

        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
             justify-content: center;
        }

        .group-card {
            background-color: white;
            border: 2px solid #e9d5ff;
            border-radius: 0.5rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(107, 70, 193, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease; /* smooth transition */
    cursor: pointer; /* optional: pointer on hover */
        }

        
            .group-card:hover {
    transform: translateY(-10px); /* lift the card up */
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15); /* stronger shadow for depth */
}

.group-card:hover,
.group-card:active,
.group-card:focus-within {
    transform: translateY(-10px);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
}

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .group-header h3 {
            color: #6d28d9;
            font-size: 1.5rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .complete-badge {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            background-color: #dcfce7;
            color: #15803d;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.875rem;
            font-weight: bold;
        }

        .section-title {
            font-size: 0.875rem;
            font-weight: bold;
            color: #7c3aed;
            margin-bottom: 0.5rem;
        }

        .requirements {
            color: #4b5563;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .requirements.complete {
            color: #15803d;
        }

        .members-list {
            list-style: none;
            margin-bottom: 1rem;
        }

        .members-list li {
            color: #374151;
            padding-left: 1rem;
            border-left: 2px solid #d8b4fe;
            margin-bottom: 0.25rem;
        }

        .volunteers-section {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid #faf5ff;
        }

        .volunteer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #faf5ff;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .volunteer-item span {
            color: #374151;
            font-weight: 500;
        }

        .volunteer-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn-confirm {
            padding: 0.25rem 1rem;
            background-color: #16a34a;
            color: white;
            border: none;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: 'Times New Roman', Times, serif;
        }

        .btn-confirm:hover {
            background-color: #15803d;
        }

        .btn-remove {
            padding: 0.25rem 1rem;
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: 'Times New Roman', Times, serif;
        }

        .btn-remove:hover {
            background-color: #dc2626;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #7c3aed;
            font-size: 1.2rem;
        }

        .error {
            background-color: #fee2e2;
            border: 2px solid #ef4444;
            color: #dc2626;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 640px) {
            .header h1 {
                font-size: 1.3rem;
                margin-top: 8px;
            }

            .header p {
                font-size: 0.8rem;
                margin-top: -8px;
            }

            .form-row {
                flex-direction: column;
            }

            .groups-grid {
                width: 80%;
                height: 60%;
                margin: 0 auto;  
            }


            .group-card p,
    .members-list li,
    .section-title {
        font-size: 0.875rem;
        margin-bottom: 0.25rem;
    }

            .form-row input,
            .form-row select,
            .btn-volunteer {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                APD Groups
            </h1>
            <p>Join a team and work together!</p>
        </div>
    </div>

    <div class="container">
        <div id="errorMessage"></div>

        <div class="volunteer-form">
            <h2>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
                Join a Group
            </h2>
            <div class="form-row">
                <input type="text" id="volunteerName" placeholder="Enter your name">
                <select id="groupSelect">
                    <option value="">Select a group</option>
                </select>
                <button class="btn-volunteer" id="volunteerBtn" onclick="addVolunteer()">Join</button>
            </div>
        </div>

        <div class="groups-grid" id="groupsContainer">
            <div class="loading">Loading groups...</div>
        </div>
    </div>

    <script>

        const cards = document.querySelectorAll('.group-card');

        cards.forEach(card => {
            card.addEventListener('touchstart', () => {
                card.style.transform = 'translateY(-10px)';
                card.style.boxShadow = '0 10px 20px rgba(0,0,0,0.15)';
            });

            card.addEventListener('touchend', () => {
                card.style.transform = 'translateY(0)';
                card.style.boxShadow = '0 4px 6px rgba(0,0,0,0.1)';
            });
        });

        // Change this to your backend URL
        const API_URL = 'http://localhost:5000/api';

        
        let groups = [];

        // Fetch all groups from backend
        async function fetchGroups() {
            try {
                const response = await fetch(`${API_URL}/groups`);
                if (!response.ok) throw new Error('Failed to fetch groups');
                groups = await response.json();
                renderGroups();
                hideError();
            } catch (error) {
                showError('Failed to load groups. Make sure the backend server is running.');
                console.error('Error fetching groups:', error);
            }
        }

        function renderGroups() {
    const container = document.getElementById('groupsContainer');
    const select = document.getElementById('groupSelect');

    if (groups.length === 0) {
        container.innerHTML = '<div class="loading">No groups found. Initialize the database first.</div>';
        return;
    }

    container.innerHTML = '';
    select.innerHTML = '<option value="">Select a group</option>'; // reset dropdown

    groups.forEach(group => {
        // ----- Create group card -----
        const card = document.createElement('div');
        card.className = 'group-card';

        let volunteersHTML = '';
        if (group.volunteers && group.volunteers.length > 0) {
            volunteersHTML = `
                <div class="volunteers-section">
                    <p class="section-title">Volunteers:</p>
                    ${group.volunteers.map(v => `
                        <div class="volunteer-item">
                            <span>${v.name}</span>
                            <div class="volunteer-buttons">
                                <button class="btn-confirm" onclick="confirmVolunteer('${group._id}', ${v.id})">Confirm</button>
                                <button class="btn-remove" onclick="removeVolunteer('${group._id}', ${v.id})">Remove</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        card.innerHTML = `
            <div class="group-header">
                <h3>${group.name}</h3>
                ${group.isComplete ? `<span class="complete-badge">Complete</span>` : ''}
            </div>
            <div>
                <p class="section-title">Requirements:</p>
                <p class="requirements ${group.isComplete ? 'complete' : ''}">${group.requirements}</p>
            </div>
            <div>
                <p class="section-title">Members:</p>
                <ul class="members-list">
                    ${group.members.map(m => `<li>${m}</li>`).join('')}
                </ul>
            </div>
            ${volunteersHTML}
        `;

        container.appendChild(card);

        // ----- Add to dropdown if group is not complete -----
        if (!group.isComplete) {
            const option = document.createElement('option');
            option.value = group._id; // ObjectId as string
            option.textContent = group.name;
            select.appendChild(option);
        }
    });
}



        function updateGroupSelect() {
            const select = document.getElementById('groupSelect');
            const currentValue = select.value;
            select.innerHTML = '<option value="">Select a group</option>';
            
            groups.filter(g => !g.isComplete).forEach(group => {
                const option = document.createElement('option');
                option.value = group._id;
                option.textContent = group.name;
                select.appendChild(option);
            });
            
            select.value = currentValue;
        }

        async function addVolunteer() {
            const nameInput = document.getElementById('volunteerName');
            const groupSelect = document.getElementById('groupSelect');
            const btn = document.getElementById('volunteerBtn');
            
            const name = nameInput.value.trim();
            /*const groupId = parseInt(groupSelect.value);*/
            const groupId = groupSelect.value;
            
            if (!name || !groupId) {
                showError('Please enter your name and select a group');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Adding...';
            
            try {
                const response = await fetch(`${API_URL}/groups/${groupId}/volunteer`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name })
                });
                
                if (!response.ok) throw new Error('Failed to add volunteer');
                
                nameInput.value = '';
                groupSelect.value = '';
                await fetchGroups();
                hideError();
            } catch (error) {
                showError('Failed to add volunteer. Please try again.');
                console.error('Error adding volunteer:', error);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Volunteer';
            }
        }

        async function confirmVolunteer(groupId, volunteerId) {
            try {
                const response = await fetch(`${API_URL}/groups/${groupId}/confirm/${volunteerId}`, {
                    method: 'POST'
                });
                
                if (!response.ok) throw new Error('Failed to confirm volunteer');
                
                await fetchGroups();
                hideError();
            } catch (error) {
                showError('Failed to confirm volunteer. Please try again.');
                console.error('Error confirming volunteer:', error);
            }
        }

        async function removeVolunteer(groupId, volunteerId) {
            try {
                const response = await fetch(`${API_URL}/groups/${groupId}/volunteer/${volunteerId}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) throw new Error('Failed to remove volunteer');
                
                await fetchGroups();
                hideError();
            } catch (error) {
                showError('Failed to remove volunteer. Please try again.');
                console.error('Error removing volunteer:', error);
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.innerHTML = `<div class="error">${message}</div>`;
        }

        function hideError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.innerHTML = '';
        }

        // Auto-refresh every 5 seconds to show updates from other users
        setInterval(fetchGroups, 5000);

        // Initialize on page load
        fetchGroups();
    </script>
</body>
</html>
